# ----- Configuración de Nginx para TecnoStore -----
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las peticiones a /api se reenvían al contenedor del servidor. Es lo
  # mismo que hace el "proxy" de package.json cuando se usa npm start.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Cualquier otra ruta devuelve la aplicación de React.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
